[project]
name = "comparar-docs-backend"
version = "0.1.0"
description = "Compara Invoice, BL e Packing List (peso líquido, peso bruto, NCM)"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi[standard]",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "pymongo>=4.18.2",
    "pypdf",
    "python-docx>=1.2.0",
    "python-multipart",
    "sqlmodel",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest",
    "xlwt>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
