# Dependências para rodar local. A aplicação em si roda com `uv run fastapi dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: comparardocs-postgres
    environment:
      POSTGRES_USER: comparardocs
      POSTGRES_PASSWORD: comparardocs
      POSTGRES_DB: comparardocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comparardocs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
